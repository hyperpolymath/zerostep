# SonarCloud automatic analysis settings.
#
# Exclude the ClusterFuzzLite build image from analysis. It builds on the
# OSS-Fuzz base-builder image, which runs as root and needs the whole source
# tree copied in (COPY . $SRC/zerostep). Both are required by ClusterFuzzLite,
# so Sonar's docker:S6471 (root user) and docker:S6470 (recursive COPY) rules
# do not apply. The image is only used in CI to build fuzzers, never shipped.
# .clusterfuzzlite/Dockerfile is a symlink to the Containerfile.
sonar.exclusions=.clusterfuzzlite/Containerfile,.clusterfuzzlite/Dockerfile
